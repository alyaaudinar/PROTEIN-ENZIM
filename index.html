function Z2(){zm.innerHTML='';
 const df=el('defs',{},zm),gr=el('linearGradient',{id:'phg',x1:0,y1:0,x2:1,y2:0},df);
 PC.forEach((c,i)=>el('stop',{offset:(i/13*100)+'%','stop-color':c},gr));
 const X=p=>12+(p-1)/13*196;
 /* skala pH 1-14 */
 el('rect',{x:12,y:27,width:196,height:15,rx:7.5,fill:'url(#phg)',stroke:'var(--mute)','stroke-width':1.5},zm);
 for(let p=1;p<=14;p++){el('line',{x1:X(p),y1:42,x2:X(p),y2:46,stroke:'var(--mute)','stroke-width':1},zm);el('text',{x:X(p),y:55,class:'zn'},zm).textContent=p}
 el('path',{d:'M'+X(1)+' 62H'+X(6.4),stroke:'#e5322d','stroke-width':3,'stroke-linecap':'round',fill:'none'},zm);
 el('circle',{cx:X(7),cy:62,r:2.5,fill:'#6fbf4a'},zm);
 el('path',{d:'M'+X(7.6)+' 62H'+X(14),stroke:'#3a5fd3','stroke-width':3,'stroke-linecap':'round',fill:'none'},zm);
 [[3.7,'ASAM'],[7,'NETRAL'],[10.5,'BASA']].forEach(a=>el('text',{x:X(a[0]),y:73,class:'zn'},zm).textContent=a[1]);
 /* isi tetesan larutan: ion H+ dan OH- */
 el('text',{x:14,y:85,class:'zl',style:'font-size:9px'},zm).textContent='Isi larutan (diperbesar):';
 el('rect',{x:12,y:89,width:196,height:48,rx:10,fill:'var(--card)',stroke:'var(--line)','stroke-width':2},zm);
 const cells=[];for(let r=0;r<3;r++)for(let c=0;c<12;c++)cells.push([24+c*15.6+(r%2?4:0),103+r*13]);
 let sd=7;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
 for(let i=cells.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
 const mk=(c,pos,ch)=>{const g=el('g',{},zm);g.style.transition='opacity .4s';el('circle',{cx:pos[0],cy:pos[1],r:5.3,fill:c,stroke:'#fff','stroke-width':.8},g);const t=el('text',{x:pos[0],y:pos[1]+3,style:'font:800 8px sans-serif;text-anchor:middle;fill:#fff'},g);t.textContent=ch;return g};
 const Hs=cells.slice(0,17).map(p=>mk('#e5322d',p,'+')),Os=cells.slice(17,34).map(p=>mk('#3a5fd3',p,'−'));
 lgd(zm,150,'dot','#e5322d','H⁺ = ion pembawa sifat asam');lgd(zm,162,'dot','#3a5fd3','OH⁻ = ion pembawa sifat basa');
 /* penanda yang bergeser di atas skala */
 const m=el('g',{},zm);m.style.transition='transform .8s cubic-bezier(.3,1.6,.5,1)';
 el('path',{d:'M0 26l-6-9h12z',fill:'var(--ink)'},m);el('line',{x1:0,y1:27,x2:0,y2:42,stroke:'#fff','stroke-width':2.2},m);
 const tx=el('text',{x:0,y:11,class:'zh'},m);
 const kind=p=>p<3?'asam kuat, H⁺ sangat banyak dan OH⁻ sangat sedikit.':Math.abs(p-7)<.5?'netral, H⁺ dan OH⁻ seimbang.':p<7?'asam lemah, H⁺ lebih banyak dari OH⁻.':p<11?'basa lemah, OH⁻ lebih banyak dari H⁺.':'basa kuat, OH⁻ sangat banyak dan H⁺ sangat sedikit.';
 const set=(ph,name)=>{const p=Math.max(1,Math.min(14,+ph));
  mv(m,X(p),0);tx.setAttribute('x',Math.max(48,Math.min(172,X(p)))-X(p));tx.textContent=(name?name+' · ':'')+'pH '+fm(p);
  const nH=Math.round(1+15*(14-p)/13),nO=Math.round(1+15*(p-1)/13);
  Hs.forEach((g,i)=>g.style.opacity=i<nH?1:0);Os.forEach((g,i)=>g.style.opacity=i<nO?1:0);
  $('#phr').value=p;$('#phv').textContent=fm(p);
  cap(name==='Saliva'?'Saliva pH sekitar 6,8: hampir netral dan sedikit asam, pas untuk amilase (optimum pH 5,6 sampai 6,9).':(name?name+' ':'')+'pH '+fm(p)+': '+kind(p))};
 set(7,'');cap('Geser slider pH di bawah gambar, atau jalankan uji untuk melihat posisi tiap larutan.');return{set}}

 for(let i=0;i<12;i++){const c=el('circle',{cx:25+i*15.5,cy:98,r:7,fill:'url(#sB)'},zm);c.style.transition='transform .7s';B.push(c)}

 lgd(zm,142,'dot','#8e7cff','Bola ungu = molekul gula penyusun pati');lgd(zm,156,'dot','#ffc857','Pacman = enzim amilase (pemotong pati)');
 const X=[40,110,190,100],CL=['#8fd3ff','#ffc857','#4cd38a','#ff5a5a'],CUT=[0,3,6,0],
 CT=['Pati = rantai gula panjang. Amilase = enzim pemotong pati.','4°C: enzim membeku, hampir tidak memotong.','25°C: enzim memotong pelan, sebagian pati terurai.','37°C: amilase memotong pati jadi maltosa. Optimum!','100°C: bentuk enzim rusak, pati tetap utuh.'],
 ST=['Pati + enzim amilase','4°C: enzim hampir tidak aktif','25°C: aktivitas sedang','37°C: AKTIF (optimum)','100°C: enzim rusak (denaturasi)'],

 [['#7bd389','Tabung hijau = jawaban benar'],['#ff8a7a','Tabung merah = perlu dipelajari lagi'],['rgba(200,215,235,.8)','Tabung abu-abu = belum dijawab']].forEach((a,i)=>{const y=34+i*38;

/* ===== mesin langkah ===== */
const NX=$('#nx'),dog=c=>$('#dog').setAttribute('class',c);let pts=0,lastOk,qc=0;
const star=()=>$('#pts').textContent='⭐ '+(++pts);
const ask=q=>new Promise(r=>{const o=$('#obs');o.innerHTML='<b>'+(q[4]?'Kuis:':'Tebak dulu!')+'</b> '+q[0]+'<div>'+q[1].map((t,i)=>'<button class="b o" data-i="'+i+'">'+t+'</button>').join('')+'</div>';o.onclick=e=>{const b=e.target.closest('button');if(!b)return;const ok=+b.dataset.i===q[2];o.onclick=null;lastOk=ok;if(ok){star();if(q[4])qc++}o.textContent=(ok?'Tepat! ⭐ ':q[4]?'Kurang tepat. ':'Hampir! ')+q[3];setTimeout(r,q[4]?300:2400)}});
function boom(){for(let i=0;i<46;i++){const d=document.createElement('i');d.className='cf';d.style.cssText='left:'+Math.random()*100+'%;background:hsl('+Math.random()*360+' 85% 60%);animation-delay:'+Math.random()*.6+'s';$('#cf').appendChild(d);setTimeout(()=>d.remove(),3600)}}
function hdr(){const N=cur.steps.length;$('#sn').textContent=si<0?'Siap dimulai':(tab==3?'Soal ':'Langkah ')+(si+1)+' dari '+N;$('#bar').style.width=((si+1)/N*100)+'%';const s=si<0?{t:cur.title,d:cur.goal}:cur.steps[si];$('#st').textContent=s.t;$('#sd').textContent=s.d}
function load(n){tab=n;document.body.dataset.t=n;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.n==n));const svg=$('#stage');svg.innerHTML='';uid=0;busy=false;qc=0;S.smp='egg';$('#zr').hidden=n!==1;Z=[Z1,Z2,Z3,Z4][n]();cur=[B1,B2,B3,B4][n](svg);si=-1;dog('');$('#obs').onclick=null;$('#obs').textContent='Halo, aku Drh. Pronzim! Tekan tombol untuk mulai.';$('#tbl').innerHTML='';NX.textContent='Mulai: '+cur.steps[0].t;NX.disabled=false;hdr()}
async function next(){if(busy)return;busy=true;NX.disabled=true;si++;hdr();const s=cur.steps[si];dog('busy');if(s.q)await ask(s.q);if(!(s.q&&s.q[4]))$('#obs').innerHTML='Sedang berjalan...';const r=await s.go();if(r){if(r[0]==='<')$('#obs').innerHTML=r;else $('#obs').textContent=r}dog('ok');setTimeout(()=>dog(''),1600);busy=false;if(si>=cur.steps.length-1){NX.textContent='Selesai 🎉';boom();$('#obs').textContent+=' Skor kamu: ⭐ '+pts+(tab==3?' (kuis benar '+qc+' dari '+cur.steps.length+')':'');return}NX.textContent='Lanjut: '+cur.steps[si+1].t;NX.disabled=!!s.hold}
NX.onclick=next;$('#rs').onclick=()=>load(tab);
$('#phr').oninput=e=>{if(tab===1&&Z)Z.set(+e.target.value,'')};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>load(+b.dataset.n));
load(0);
